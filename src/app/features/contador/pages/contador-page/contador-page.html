@if (contador(); as contadorAtual) {
  <div id="conteudo">
    <div id="contador">
      <app-contador-display [contador]="contadorAtual" />

      @if (contadorAtual.mostrarLimites) {
        <div class="limites">
          <app-limite
            nome="Mínimo"
            [valor]="contadorAtual.valorMinimo ?? 'Indefinido'"
            [comBackground]="
              contadorAtual.valorMinimo !== null &&
              contadorAtual.valorAtual <= contadorAtual.valorMinimo
            "
          />

          <app-limite
            [nome]="'Meta'"
            [valor]="contadorAtual.meta ?? 'Indefinido'"
            [comBackground]="
              contadorAtual.meta !== null &&
              contadorAtual.valorAtual >= contadorAtual.meta
            "
          />

          <app-limite
            [nome]="'Maximo'"
            [valor]="contadorAtual.valorMaximo ?? 'Indefinido'"
            [comBackground]="
              contadorAtual.valorMaximo !== null &&
              contadorAtual.valorAtual >= contadorAtual.valorMaximo
            "
          />
        </div>
      }

      @if (contadorAtual.subtracaoComoPrincipal) {
        <app-botao-subtrair (clicou)="decrementar()" [isPrincipal]="true" [efeitoAoClicar]="contadorAtual.efeitoVisualAoClicar"/>
        <app-botao-adicionar (clicou)="incrementar()" [isPrincipal]="false" [efeitoAoClicar]="contadorAtual.efeitoVisualAoClicar"/>
      } @else {
        <app-botao-adicionar (clicou)="incrementar()" [isPrincipal]="true" [efeitoAoClicar]="contadorAtual.efeitoVisualAoClicar"/>
        <app-botao-subtrair (clicou)="decrementar()" [isPrincipal]="false" [efeitoAoClicar]="contadorAtual.efeitoVisualAoClicar"/>
      }

      <div class="acoes">
        <div class="acao-esquerda">
          @if (contadorAtual.mostrarBotaoReset) {
            <mat-icon id="reset" (click)="abrirAlerta()">refresh</mat-icon>
          }
        </div>

        <div class="acao-direita">
          @if (contadorAtual.mostrarBotaoEditar) {
            <mat-icon
              id="editar"
              [routerLink]="['/contador', contadorAtual.id, 'editar']"
            >
              edit
            </mat-icon>
          }
        </div>
      </div>
    </div>

    <app-menu-opcoes id="menu"></app-menu-opcoes>

  </div>
}
