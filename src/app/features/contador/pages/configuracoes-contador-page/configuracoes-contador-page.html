<div id="container">
  @if (contador(); as contadorAtual) {

    <!-- Valores e limites -->
    <h3 class="titulo">Valores e limites</h3>
    <div class="bloco">

      <app-item-configuracao
        icone1="edit"
        descricao="Nome"
        icone2="arrow_forward_ios"
        [valor]="contadorAtual.nome"
        [botao]="false"
        (clicouIcone2)="abrirDialogMeta(
          'nome',
          'Alterar nome',
          contadorAtual.nome
        )"
      />

      <hr>

      <app-item-configuracao
        icone1="radio_button_unchecked"
        descricao="Valor Atual"
        icone2="arrow_forward_ios"
        [valor]="contadorAtual.valorAtual"
        [botao]="false"
        (clicouIcone2)="abrirDialogMeta(
          'valor-atual',
          'Alterar valor atual',
          contadorAtual.valorAtual
        )"
      />

      <hr>

      <app-item-configuracao
        icone1="vertical_align_bottom"
        descricao="Valor mínimo"
        icone2="arrow_forward_ios"
        [valor]="contadorAtual.valorMinimo"
        [botao]="false"
        (clicouIcone2)="abrirDialogMeta(
          'valor-minimo',
          'Alterar valor mínimo',
          contadorAtual.valorMinimo ?? -1
        )"
      />

      <hr>


      <app-item-configuracao
        icone1="vertical_align_top"
        descricao="Valor maximo"
        icone2="arrow_forward_ios"
        [valor]="contadorAtual.valorMaximo"
        [botao]="false"
        (clicouIcone2)="abrirDialogMeta(
          'valor-maximo',
          'Alterar valor maximo',
          contadorAtual.valorMaximo ?? -1
        )"
      />

      <hr>

      <app-item-configuracao
        icone1="flag"
        descricao="Meta"
        icone2="arrow_forward_ios"
        [valor]="contadorAtual.meta"
        [botao]="false"
        (clicouIcone2)="abrirDialogMeta(
          'meta',
          'Alterar Meta',
          contadorAtual.meta ?? -1
        )"
      />
    </div>

    <!-- Operações -->
    <h3 class="titulo">Operações</h3>
    <div class="bloco">
      <app-item-configuracao
        icone1="add"
        descricao="Incremento padrão"
        icone2="arrow_forward_ios"
        [valor]="'+' + contadorAtual.incremento"
        [botao]="false"
        (clicouIcone2)="abrirDialogMeta(
          'incremento',
          'Alterar Incremento',
          contadorAtual.incremento
        )"
      />

      <hr>

      <app-item-configuracao
        icone1="remove"
        descricao="Incremento padrão"
        icone2="arrow_forward_ios"
        [valor]="'-' + contadorAtual.decremento"
        [botao]="false"
        (clicouIcone2)="abrirDialogMeta(
          'decremento',
          'Alterar Incremento',
          contadorAtual.decremento
        )"
      />

      <hr>

      <app-item-configuracao
        icone1="menu"
        descricao="Operação principal"
        icone2="arrow_forward_ios"
        [valor]="contadorAtual.subtracaoComoPrincipal ? 'SUBTRAÇÃO' : 'ADIÇÃO'"
        [botao]="true"
        [switchAtivo]="contadorAtual.subtracaoComoPrincipal"
        (onChangedSwitch)="atualizarOperacaoPrincipal($event)"
      />
    </div>

    <!-- Botões e aparência -->
    <h3 class="titulo">Botões e aparência</h3>
    <div class="bloco">
      <app-item-configuracao
        icone1="restart_alt"
        descricao="Mostrar botão reset"
        icone2="arrow_forward_ios"
        [valor]="contadorAtual.mostrarBotaoReset
          ? 'Exibir o botão reset na tela do contador'
          : 'Ocultar o botão reset na tela do contador'"
        [botao]="true"
        [switchAtivo]="contadorAtual.mostrarBotaoReset"
        (onChangedSwitch)="mostrarBotaoReset($event)"
      />

      <hr>

      <app-item-configuracao
        icone1="edit"
        descricao="Mostrar botão editar"
        icone2="arrow_forward_ios"
        [valor]="contadorAtual.mostrarBotaoEditar
          ? 'Exibir o botão editar na tela do contador'
          : 'Ocultar o botão editar na tela do contador'"
        [botao]="true"
        [switchAtivo]="contadorAtual.mostrarBotaoEditar"
        (onChangedSwitch)="mostrarBotaoEditar($event)"
      />

      <hr>

      <app-item-configuracao
        icone1="assignment_turned_in"
        descricao="Mostrar limites"
        icone2="arrow_forward_ios"
        [valor]="contadorAtual.mostrarLimites
          ? 'Exibir MAXIMO, MINIMO E META na tela do contador'
          : 'Ocultar MAXIMO, MINIMO E META na tela do contador'"
        [botao]="true"
        [switchAtivo]="contadorAtual.mostrarLimites"
        (onChangedSwitch)="mostrarBotaoLimites($event)"
      />
    </div>

    <!-- Comportamento -->
    <h3 class="titulo">Comportamento</h3>
    <div class="bloco">
      <app-item-configuracao
        icone1="fact_check"
        descricao="Confirmar antes de resetar"
        icone2="arrow_forward_ios"
        [valor]="contadorAtual.confirmarAntesResetar
          ? 'Exibir confirmação antes de resetar o contador'
          : 'Não exibir confirmação antes de resetar o contador'"
        [botao]="true"
        [switchAtivo]="contadorAtual.confirmarAntesResetar"
        (onChangedSwitch)="confirmarAntesResetar($event)"
      />

      <hr>

      <app-item-configuracao
        icone1="light_mode"
        descricao="Efeito ao clicar"
        icone2="arrow_forward_ios"
        [valor]="contadorAtual.efeitoVisualAoClicar
          ? 'Exibir efeito visual ao incrementar ou decrementar o contador'
          : 'Não exibir efeito visual ao incrementar ou decrementar o contador'"
        [botao]="true"
        [switchAtivo]="contadorAtual.efeitoVisualAoClicar"
        (onChangedSwitch)="efeitoAoClicar($event)"
      />

    </div>

    <div
      class="deletar"
      (click)="abrirAlerta()"
    >
      <p>Deletar contador</p>
    </div>

  } @else {
    <p>Carregando...</p>
  }
</div>
