<div id="container">

  <h3 class="titulo">Valores e limites</h3>
  <div class="bloco">
    @if (contador(); as contadorAtual) {
      <app-item-configuracao
        icone1="edit"
        descricao="Nome"
        [valor]="contadorAtual.nome"
        icone2="arrow_forward_ios"
        [botao]="false"
        (clicouIcone2)="abrirDialogMeta(
      'nome',
      'Alterar nome',
      contadorAtual.nome
    )"
      />
    } @else {
      <p>Carregando...</p>
    }

    <hr>

    <app-item-configuracao
      icone1="radio_button_unchecked"
      descricao="Valor Atual"
      valor="+1"
      icone2="arrow_forward_ios"
      [botao]="false"
      (clicouIcone2)="abrirDialogMeta(
        'valor-atual',
        'Alterar valor atual',
        contador()?.valorAtual ?? ''
      )"
    ></app-item-configuracao>

    <hr>

    <app-item-configuracao
      icone1="vertical_align_bottom"
      descricao="Valor mínimo"
      valor="+1"
      icone2="arrow_forward_ios"
      [botao]="false"
      (clicouIcone2)="abrirDialogMeta(
        'valor-minimo',
        'Alterar valor mínimo',
        30
      )"
    ></app-item-configuracao>

    <hr>


    <app-item-configuracao
      icone1="vertical_align_bottom"
      descricao="Valor maximo"
      valor="+1"
      icone2="arrow_forward_ios"
      [botao]="false"
      (clicouIcone2)="abrirDialogMeta(
        'valor-maximo',
        'Alterar valor maximo',
        30
      )"
    ></app-item-configuracao>

    <hr>

    <app-item-configuracao
      icone1="flag"
      descricao="Meta"
      valor="+1"
      icone2="arrow_forward_ios"
      [botao]="false"
      (clicouIcone2)="abrirDialogMeta(
        'meta',
        'Alterar Meta',
        30
      )"
    ></app-item-configuracao>
  </div>

  <h3 class="titulo">Operações</h3>
  <div class="bloco">
    <app-item-configuracao
      icone1="add"
      descricao="Incremento padrão"
      valor="+1"
      icone2="arrow_forward_ios"
      [botao]="false"
      (clicouIcone2)="abrirDialogMeta(
        'incremento',
        'Alterar Incremento',
        30
      )"
    ></app-item-configuracao>

    <hr>

    <app-item-configuracao
      icone1="remove"
      descricao="Incremento padrão"
      valor="+1"
      icone2="arrow_forward_ios"
      [botao]="false"
      (clicouIcone2)="abrirDialogMeta(
        'incremento',
        'Alterar Incremento',
        30
      )"
    ></app-item-configuracao>

    <hr>

    <app-item-configuracao
      icone1="architecture"
      descricao="Incremento padrão"
      valor="+1"
      icone2="arrow_forward_ios"
      [botao]="true"
    ></app-item-configuracao>
  </div>

  <h3 class="titulo">Botões e aparência</h3>
  <div class="bloco">
    <app-item-configuracao
      icone1="rotate_left"
      descricao="Incremento padrão"
      valor="+1"
      icone2="arrow_forward_ios"
      [botao]="true"
    ></app-item-configuracao>

    <hr>

    <app-item-configuracao
      icone1="edit"
      descricao="Incremento padrão"
      valor="+1"
      icone2="arrow_forward_ios"
      [botao]="true"
    ></app-item-configuracao>

    <hr>

    <app-item-configuracao
      icone1="info"
      descricao="Incremento padrão"
      valor="+1"
      icone2="arrow_forward_ios"
      [botao]="true"
    ></app-item-configuracao>
  </div>

  <h3 class="titulo">Comportamento</h3>
  <div class="bloco">
    <app-item-configuracao
      icone1="warning"
      descricao="Incremento padrão"
      valor="+1"
      icone2="arrow_forward_ios"
      [botao]="true"
    ></app-item-configuracao>

    <hr>

    <app-item-configuracao
      icone1="vibration"
      descricao="Incremento padrão"
      valor="+1"
      icone2="arrow_forward_ios"
      [botao]="true"
    ></app-item-configuracao>

  </div>

  <div class="deletar">
    <p>Deletar contador</p>
  </div>
</div>
