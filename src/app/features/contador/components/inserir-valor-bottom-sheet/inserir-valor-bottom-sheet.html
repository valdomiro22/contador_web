<div class="conteudo">
  <h2>Definir valor</h2>

  <mat-form-field appearance="outline">
    <mat-label>Valor</mat-label>

    <input
      matInput
      type="number"
      [(ngModel)]="valor"
    />
  </mat-form-field>

  <div class="acoes">
    <button
      mat-button
      type="button"
      (click)="cancelar()"
    >
      Cancelar
    </button>

    <button
      mat-flat-button
      type="button"
      (click)="salvar()"
    >
      Salvar
    </button>
  </div>
</div>
